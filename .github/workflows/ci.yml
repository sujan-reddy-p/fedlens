name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend with development dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        working-directory: backend
        run: python -m pytest
